name: Build LimpaPC (Windows)

on:
  push:
    paths:
      - "limpador/**"
      - ".github/workflows/limpapc-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 2.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: limpador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install pyinstaller psutil send2trash pillow
      - name: Gerar ícone e metadados de versão
        run: |
          python tools/make_icon.py
          python tools/make_version_file.py ${{ env.VERSION }}
      - name: Teste rápido de importação
        run: python -c "import limpapc.gui, limpapc.recovery, limpapc.analyzer; from limpapc import __version__; print('ok', __version__)"
      - name: Gerar LimpaPC.exe (portátil)
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LimpaPC --icon assets/icon.ico --version-file version_info.txt main.py
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: LimpaPC-Windows
          path: |
            limpador/dist/LimpaPC.exe
            limpador/dist/LimpaPC-Setup.exe
      - name: Publicar para download (GitHub Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: limpapc-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: LimpaPC ${{ env.VERSION }}
          make_latest: true
          body: |
            ## Baixe um dos arquivos abaixo
            - **`LimpaPC-Setup.exe`**: instalador (atalho no Menu Iniciar e na Área de Trabalho, desinstala pelo Windows)
            - **`LimpaPC.exe`**: versão portátil, é só abrir

            ### Novidades da versão 2
            - Visual novo com menu lateral e modo claro/escuro
            - Painel com análise completa em 1 clique e nota de saúde do PC
            - Mapa do disco: veja o que ocupa espaço pasta por pasta
            - Recuperação de arquivos: restaurar da Lixeira e recuperar apagados (NTFS e busca por assinatura)
            - Ferramentas do Windows (hibernação, limpeza do Windows Update, DNS…)
            - Configurações salvas, exclusões, busca nas listas, exportar CSV e aviso de novas versões

            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o programa ainda não tem assinatura digital).
          files: |
            limpador/dist/LimpaPC.exe
            limpador/dist/LimpaPC-Setup.exe
