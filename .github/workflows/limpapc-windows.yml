name: Build LimpaPC (Windows)

on:
  push:
    paths:
      - "limpador/**"
      - ".github/workflows/limpapc-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: limpador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install pyinstaller psutil send2trash
      - name: Teste rápido de importação
        run: python -c "import limpapc.gui, limpapc.system, limpapc.scanners; print('ok')"
      - name: Gerar LimpaPC.exe (portátil)
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LimpaPC main.py
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: LimpaPC-Windows
          path: |
            limpador/dist/LimpaPC.exe
            limpador/dist/LimpaPC-Setup.exe
      - name: Publicar para download (GitHub Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: limpapc-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: LimpaPC 1.0.${{ github.run_number }} (Windows)
          make_latest: true
          body: |
            **Baixe um dos arquivos abaixo:**
            - `LimpaPC-Setup.exe`: instalador (cria atalho no Menu Iniciar e na Área de Trabalho)
            - `LimpaPC.exe`: versão portátil, não precisa instalar, é só abrir

            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o programa não tem assinatura digital paga).
          files: |
            limpador/dist/LimpaPC.exe
            limpador/dist/LimpaPC-Setup.exe
