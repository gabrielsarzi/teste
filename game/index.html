<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#26241a">
<title>Último Bunker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: coluna de celular em pé — HUD escuro e quente no topo, campo de grama no meio, botões redondos de onda/velocidade no canto do polegar. */
:root{
  color-scheme: dark;
  --bg:#1a1810; --panel:#26241a; --panel2:#3a3726; --line:#5d5940; --ink:#fbf4e0; --muted:#c9bf9c;
  --amber:#f2b84b; --amber2:#ffd77a; --rust:#c98a22; --toxic:#9fe870; --blood:#e8735a; --ice:#7fd3f5; --teal:#6fe3d0;
  --f-pix:"Silkscreen", "Courier New", monospace; --f-body:"IBM Plex Sans", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:560px;margin:0 auto;background:#7a8448;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible{outline:3px solid var(--amber2);outline-offset:2px}
.ico{display:inline-block;width:18px;height:18px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;vertical-align:middle;flex:none}

#hud{display:flex;flex-direction:column;gap:8px;padding:10px 10px 8px;background:var(--panel);border-bottom:3px solid #4d4a33}
.hrow{display:flex;align-items:center;gap:8px;min-width:0}
#hpBox{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hplab{display:flex;justify-content:space-between;font-family:var(--f-pix);font-size:11px;font-weight:700;text-transform:uppercase}
.hplab b{color:var(--toxic);font-variant-numeric:tabular-nums}
#hpSegs{display:grid;gap:2px;height:12px}
#hpSegs i{background:#4d4a33}
#hpSegs i.ok{background:var(--toxic)}
#hpSegs i.bad{background:var(--blood)}
#hpBox.low .hplab b{color:var(--blood);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.chip{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:6px;background:var(--panel2);font-family:var(--f-pix);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
#goldBox{color:var(--amber)} #essBox{color:var(--toxic)}
.waveInfo{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.waveInfo b{font-family:var(--f-pix);font-size:14px}
.waveInfo small{font-size:11px;color:var(--muted)}
.hsp{flex:1}
.hbtn{font-family:var(--f-pix);font-size:15px;font-weight:700;background:var(--panel2);border:0;border-radius:6px;box-shadow:inset 0 0 0 2px var(--line);padding:0 10px;min-width:40px;height:36px}
.hbtn.txt{font-size:11px;color:var(--muted)}
.hbtn:active{filter:brightness(1.3)}
.round{position:absolute;z-index:4;border:0;border-radius:50%;font-family:var(--f-pix);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05}
#btnWave{left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:96px;height:96px;background:var(--amber);color:#2b2210;box-shadow:inset 0 -7px 0 var(--rust),0 0 0 4px var(--panel),0 6px 0 4px var(--panel)}
#btnWave b{font-size:14px} #btnWave span{font-size:10px;font-weight:700} #btnWave small{font-family:var(--f-body);font-size:12px;font-weight:600}
#btnWave small:empty{display:none}
#btnWave:active{transform:translateY(3px)}
#btnWave:disabled{background:#8c8466;color:var(--ink);box-shadow:inset 0 -7px 0 #6b6449,0 0 0 4px var(--panel),0 6px 0 4px var(--panel)}
.round.sm{left:calc(max(12px,env(safe-area-inset-left,0px)) + 108px);bottom:14px;width:54px;height:54px;background:var(--panel2);color:var(--ink);font-size:15px;font-weight:700;box-shadow:inset 0 -5px 0 var(--panel),0 0 0 4px var(--panel)}

#stage{position:relative;overflow:hidden;touch-action:none;min-height:0}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}

#radial{position:absolute;width:0;height:0;z-index:5}
.rb{position:absolute;left:-31px;top:-31px;width:62px;height:62px;border-radius:50%;background:var(--panel);border:0;box-shadow:0 0 0 3px var(--amber),0 4px 0 3px #1a1810;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;transition:transform .12s ease-out}
.rb img{width:22px;height:30px;image-rendering:pixelated}
.rb .nm{font-size:9px;line-height:1.05;text-align:center;font-weight:600;max-width:58px}
.rb .nm.big{font-family:var(--f-pix);font-size:13px}
.rb .nm.b{color:var(--amber2)}
.rb .up{color:var(--toxic);font-size:14px;line-height:1}
.rb .cost{font-family:var(--f-pix);font-size:11px;color:var(--amber2)}
.rb .cost.poor{color:var(--blood)}
.rb .cost.gain{color:var(--toxic)}
.rb.br-a{box-shadow:0 0 0 3px var(--amber),0 4px 0 3px #1a1810}
.rb.br-b{box-shadow:0 0 0 3px var(--teal),0 4px 0 3px #1a1810}
.rb.sell{background:#3a2218;box-shadow:0 0 0 3px #b54a3a,0 4px 0 3px #1a1810}
.rb.off{opacity:.6}
.rb:active{filter:brightness(1.3)}
.rlabel{pointer-events:none;position:absolute;left:0;top:0;white-space:nowrap;background:var(--panel);border-radius:8px;padding:5px 10px;text-align:center;display:flex;flex-direction:column;box-shadow:0 0 0 3px var(--amber)}
.rlabel b{font-family:var(--f-pix);font-weight:400;font-size:12px;color:var(--amber2)}
.rlabel span{font-size:11px;color:var(--muted)}
.rlabel span:empty{display:none}

.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);max-width:calc(100% - 32px);background:var(--panel);border-radius:8px;box-shadow:0 0 0 2px var(--line);padding:8px 12px;font-size:13px;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:6}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.big{font-family:var(--f-pix);font-size:22px;color:var(--blood);bottom:auto;top:35%;padding:10px 18px}

#bar{display:flex;gap:8px;padding:8px 10px 10px;background:linear-gradient(var(--bg),var(--panel));border-top:2px solid var(--line)}
.big{flex:1;font-family:var(--f-pix);background:var(--amber);color:#1c1206;border:0;box-shadow:0 4px 0 #6b4510,0 0 0 2px #000;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;justify-content:center}
.big small{font-family:var(--f-body);font-size:12px;font-weight:600;opacity:.85}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4510,0 0 0 2px #000}
.big:disabled{background:#5a4a33;color:#d8c9a8;box-shadow:0 4px 0 #2b2420,0 0 0 2px #000}
.alt{font-family:var(--f-pix);font-size:13px;background:var(--panel2);border:0;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #000;padding:8px 12px}

.screen{position:fixed;inset:0;z-index:20;background:#1a1810e6;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));touch-action:auto}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--panel);border-radius:10px;box-shadow:0 0 0 3px var(--line),6px 8px 0 3px #0008;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-pix);font-weight:400;font-size:22px;margin:0;color:var(--amber2);text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45}
.logo{font-family:var(--f-pix);font-weight:700;font-size:clamp(34px,11vw,52px);line-height:.95;margin:0;color:var(--amber);text-shadow:0 4px 0 #6b4510,0 8px 0 #000;letter-spacing:.02em}
.logo span{display:block;color:var(--ink);font-size:.55em;text-shadow:0 3px 0 #000}
.tag{font-family:var(--f-pix);font-size:12px;color:var(--toxic);letter-spacing:.12em;text-transform:uppercase}
#scrMenu{background:radial-gradient(ellipse at 50% 120%,#5a4a1e 0,#1a1810 65%)}
#scrMenu .card{background:transparent;box-shadow:none;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1}
.menuStats{display:flex;flex-direction:column;gap:6px;font-family:var(--f-pix);font-size:14px}
.menuStats div{display:flex;align-items:center;gap:8px}
#menuOffline{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:var(--panel2);border:0;box-shadow:inset 0 0 0 2px var(--line);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.opt .val{font-family:var(--f-pix);font-size:13px;color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:15px}
.kv b{font-family:var(--f-pix);font-weight:400;font-variant-numeric:tabular-nums;text-align:right}
#overEss{color:var(--toxic)}

#talTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#talTabs button{font-family:var(--f-pix);font-size:12px;background:var(--panel2);border:0;box-shadow:inset 0 0 0 2px var(--line);padding:8px 2px;color:var(--muted)}
#talTabs button[aria-selected="true"]{background:var(--amber);color:#1c1206;box-shadow:none}
#talList{display:flex;flex-direction:column;gap:0}
.tal{display:flex;gap:10px;align-items:center;padding:10px;background:#0004;box-shadow:inset 0 0 0 2px var(--line);position:relative;margin-bottom:14px}
.tal:not(:last-child)::after{content:"";position:absolute;left:22px;bottom:-16px;width:4px;height:14px;background:var(--line)}
.tal.has{box-shadow:inset 0 0 0 2px #6b8a3a}
.tal.has:not(:last-child)::after{background:#6b8a3a}
.tal.locked{opacity:.5}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tinfo b{font-family:var(--f-pix);font-weight:400;font-size:13px}
.tinfo p{font-size:12px}
.tinfo small{font-family:var(--f-pix);font-size:11px;color:var(--amber2)}
.buy{font-family:var(--f-pix);font-size:13px;background:var(--toxic);color:#10200a;border:0;box-shadow:0 3px 0 #3d6a1c;padding:8px 10px;display:flex;align-items:center;gap:4px;min-width:74px;justify-content:center}
.buy:disabled{background:#3a3a30;color:#8c8a76;box-shadow:0 3px 0 #1a1a14}
.essHead{display:flex;align-items:center;justify-content:space-between}
.essHead span{font-family:var(--f-pix);font-size:16px;color:var(--toxic);display:flex;align-items:center;gap:6px}
.goldBig{display:flex;align-items:center;gap:8px}
.goldBig div{display:flex;flex-direction:column;line-height:1.05}
.goldBig b{font-family:var(--f-pix);font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums}
.goldBig small{font-family:var(--f-pix);font-size:12px;color:var(--toxic)}
.ico.icoL{width:28px;height:28px;background-repeat:no-repeat;background-position:center;align-self:center}
.essHead .gold{color:var(--amber)}
#floorUi{position:absolute;inset:0;pointer-events:none;z-index:3}
#floorUi button{pointer-events:auto;position:absolute;left:0;top:0}
.hire{margin:-17px 0 0 -38px;width:76px;height:34px;border:0;border-radius:8px;background:var(--panel);box-shadow:0 0 0 2px var(--amber),0 3px 0 2px #1a1810;color:var(--ink);font-family:var(--f-pix);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.hire .hn{font-size:11px}.hire .hc{font-size:11px;color:var(--amber)}
.hire.poor{box-shadow:0 0 0 2px var(--line),0 3px 0 2px #1a1810}.hire.poor .hc{color:var(--blood)}
.dig{margin:-28px 0 0 -125px;width:250px;height:56px;border:0;border-radius:10px;background:var(--amber);color:#2b2210;box-shadow:inset 0 -5px 0 var(--rust),0 0 0 3px var(--panel);font-family:var(--f-pix);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dig b{font-size:11px}.dig span{font-size:12px;font-weight:700}
.dig.poor{background:#8c8466;color:var(--ink);box-shadow:inset 0 -5px 0 #6b6449,0 0 0 3px var(--panel)}
#btnUp{left:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:86px;height:86px;background:var(--toxic);color:#10200a;box-shadow:inset 0 -6px 0 #5f9a3a,0 0 0 4px var(--panel),0 5px 0 4px var(--panel)}
#btnUp b{font-size:11px}
#btnTop{left:auto;right:calc(max(12px,env(safe-area-inset-right,0px)) + 98px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hrow">
      <div class="goldBig"><i class="ico icoL" data-ico="coin"></i><div><b id="gold">0</b><small id="rate">0/s</small></div></div>
      <span class="hsp"></span>
      <div class="waveInfo"><b data-t="mine">Mina</b><small id="depth"></small></div>
      <button class="hbtn" id="btnPause" type="button" aria-label="Pausa">II</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="gl"></canvas><canvas id="fx"></canvas>
    <div id="floorUi"></div>
    <div id="radial" hidden></div>
    <div id="toast" class="toast"></div>
    <button class="round" id="btnUp" type="button"><b data-t="upgrades">Melhorias</b></button>
    <button class="round sm" id="btnTop" type="button" aria-label="Topo">▲</button>
  </div>
</div>

<div class="screen" id="scrMenu">
  <div class="card">
    <div class="tag" data-t="subtitle">Mina · zumbis</div>
    <h1 class="logo" id="logo">ÚLTIMO<span>BUNKER</span></h1>
    <div class="menuStats">
      <div><i class="ico" data-ico="coin"></i><span id="menuGold">0</span></div>
    </div>
    <button class="big" id="btnPlay" type="button">Jogar</button>
    <button class="alt" id="btnMenuUp" type="button" data-t="upgrades">Melhorias</button>
    <div class="opts">
      <button class="opt optLang" type="button"><span data-t="language"></span><span class="val">PT</span></button>
      <button class="opt optSfx" type="button"><span data-t="sfx"></span><span class="val"></span></button>
      <button class="opt optMusic" type="button"><span data-t="music"></span><span class="val"></span></button>
    </div>
  </div>
</div>

<div class="screen" id="scrUpgrades" hidden>
  <div class="card">
    <div class="essHead"><h2 data-t="upgrades">Melhorias</h2><span class="gold"><i class="ico" data-ico="coin"></i><b id="upGold">0</b></span></div>
    <div id="upList"></div>
    <button class="alt" id="btnUpBack" type="button" data-t="back">Voltar</button>
  </div>
</div>

<div class="screen" id="scrPause" hidden>
  <div class="card">
    <h2 data-t="paused"></h2>
    <button class="big" id="btnResume" type="button" data-t="resume"></button>
    <div class="opts">
      <button class="opt optLang" type="button"><span data-t="language"></span><span class="val">PT</span></button>
      <button class="opt optSfx" type="button"><span data-t="sfx"></span><span class="val"></span></button>
      <button class="opt optMusic" type="button"><span data-t="music"></span><span class="val"></span></button>
    </div>
    <button class="alt" id="btnReset" type="button" data-t="resetGame"></button>
  </div>
</div>

<div class="screen" id="scrConfirm" hidden>
  <div class="card">
    <p id="confirmText"></p>
    <button class="big" id="btnNo" type="button" data-t="no"></button>
    <button class="alt" id="btnYes" type="button" data-t="yes"></button>
  </div>
</div>

<div class="screen" id="scrOffline" hidden>
  <div class="card">
    <h2 data-t="offlineTitle"></h2>
    <p id="offBody"></p>
    <button class="big" id="btnCollect" type="button" data-t="collect"></button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="src/i18n.js"></script>
<script src="src/data.js"></script>
<script src="src/audio.js"></script>
<script src="src/art.js"></script>
<script src="src/art3.js"></script>
<script src="src/game.js"></script>
</body>
</html>
